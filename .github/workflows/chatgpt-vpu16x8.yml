name: ChatGPT VPU16x8 RTL validation

on:
  push:
    branches: [chatgpt/vpu16x8-spu8]
  workflow_dispatch:

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vpu16x8-spu8
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile VPU x8 core
        run: iverilog -g2012 -tnull -s Matrix_Vector_Multiplication TESTBENCH/vendor_stubs.v RTL/Dual_Port_BRAM.v RTL/PMAU_Full.v RTL/VPU_Result_Requantizer.v RTL/Matrix_Vector_Multiplication.v
      - name: Compile SPU x8 stream
        run: iverilog -g2012 -tnull -s SPU_VPU_Stream8 RTL/SPU_Q8_Scale_Accum.v RTL/SPU_VPU_Stream8.v
      - name: Compile integrated AXI/VPU/SPU RTL
        run: iverilog -g2012 -tnull -s AXI4_Mapping TESTBENCH/vendor_stubs.v RTL/*.v
