name: ChatGPT VPU16x8 RTL validation

on:
  push:
    branches: [chatgpt/vpu16x8-spu8]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vpu16x8-spu8
          fetch-depth: 0
      - name: Apply RTL transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TESTBENCH/apply_vpu16x8.py')
          s=p.read_text()
          old='s = regex_rep(s, rf"wire(\\s+){name}(\\s*=)", rf"wire\\1legacy_{name}\\2", f"rename {name}")'
          new='s = regex_rep(s, rf"(wire(?:\\s+\\[[^\\]]+\\])?\\s+){name}(\\s*=)", rf"\\1legacy_{name}\\2", f"rename {name}")'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          python3 TESTBENCH/apply_vpu16x8.py
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile VPU x8 core
        run: iverilog -g2012 -tnull -s Matrix_Vector_Multiplication TESTBENCH/vendor_stubs.v RTL/Dual_Port_BRAM.v RTL/PMAU_Full.v RTL/VPU_Result_Requantizer.v RTL/Matrix_Vector_Multiplication.v
      - name: Compile SPU x8 stream
        run: iverilog -g2012 -tnull -s SPU_VPU_Stream8 RTL/SPU_Q8_Scale_Accum.v RTL/SPU_VPU_Stream8.v
      - name: Compile integrated AXI/VPU/SPU RTL
        run: iverilog -g2012 -tnull -s AXI4_Mapping TESTBENCH/vendor_stubs.v RTL/*.v
      - name: Commit transformed RTL
        run: |
          git config user.name "chatgpt-rtl"
          git config user.email "chatgpt-rtl@users.noreply.github.com"
          git add RTL/Matrix_Vector_Multiplication.v RTL/SPU_Top.v RTL/AXI4_Mapping.v
          if ! git diff --cached --quiet; then
            git commit -m "rtl: expand VPU to 16x8 and add 8-lane SPU stream"
            git push origin HEAD:chatgpt/vpu16x8-spu8
          fi
