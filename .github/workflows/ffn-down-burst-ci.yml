name: Validate FFN-down raw burst scheduler

on:
  push:
    branches:
      - chatgpt/vpu16x8-spu8
    paths:
      - TOOLS/apply_ffn_down_burst.py
      - TESTBENCH/tb_VPU8_burst.v
      - .github/workflows/ffn-down-burst-ci.yml

permissions:
  contents: write

jobs:
  patch-simulate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/vpu16x8-spu8
          fetch-depth: 0

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Apply candidate scheduler patch
        run: |
          python3 TOOLS/apply_ffn_down_burst.py
          cmp RTL/Matrix_Vector_Multiplication.v DATN_VIVADO/project_2/src/Matrix_Vector_Multiplication.v
          git diff --check
          git diff -- RTL/Matrix_Vector_Multiplication.v

      - name: Compile and simulate existing x8 VPU regression
        run: |
          iverilog -g2012 -s tb_VPU8_bundle -o /tmp/tb_vpu8 \
            TESTBENCH/vendor_stubs.v \
            RTL/Dual_Port_BRAM.v RTL/PMAU_Full.v RTL/VPU_Result_Requantizer.v RTL/Matrix_Vector_Multiplication.v \
            TESTBENCH/tb_VPU8_bundle.v
          vvp /tmp/tb_vpu8 | tee /tmp/tb_vpu8.log
          grep -q "PASS tb_VPU8_bundle" /tmp/tb_vpu8.log

      - name: Compile and simulate 10-block burst regression
        run: |
          iverilog -g2012 -s tb_VPU8_burst -o /tmp/tb_vpu8_burst \
            TESTBENCH/vendor_stubs.v \
            RTL/Dual_Port_BRAM.v RTL/PMAU_Full.v RTL/VPU_Result_Requantizer.v RTL/Matrix_Vector_Multiplication.v \
            TESTBENCH/tb_VPU8_burst.v
          vvp /tmp/tb_vpu8_burst | tee /tmp/tb_vpu8_burst.log
          grep -q "PASS tb_VPU8_burst" /tmp/tb_vpu8_burst.log

      - name: Compile and simulate VPU-SPU x8 integration regression
        run: |
          iverilog -g2012 -s tb_VPU_SPU8_integration -o /tmp/tb_vpu_spu8 \
            TESTBENCH/vendor_stubs.v \
            RTL/Dual_Port_BRAM.v RTL/PMAU_Full.v RTL/VPU_Result_Requantizer.v RTL/Matrix_Vector_Multiplication.v \
            RTL/SPU_Q8_Scale_Accum.v RTL/SPU_VPU_Stream8.v RTL/SPU_Local_Memory.v \
            TESTBENCH/tb_VPU_SPU8_integration.v
          vvp /tmp/tb_vpu_spu8 | tee /tmp/tb_vpu_spu8.log
          grep -q "PASS tb_VPU_SPU8_integration" /tmp/tb_vpu_spu8.log

      - name: Commit only validated RTL and keep regression test
        run: |
          rm -f TOOLS/apply_ffn_down_burst.py .github/workflows/ffn-down-burst-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "VPU: burst P2 raw blocks before ordered retirement"
          git push origin HEAD:chatgpt/vpu16x8-spu8
